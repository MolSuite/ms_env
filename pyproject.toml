[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms_env"
dynamic = ["version"]  # from the git tag, see [tool.setuptools_scm]
description = "Environments for MolSuite apps: find or install external tools, on this machine or over ssh."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mario S. Valdés-Tresanco" },
    { name = "Mario E. Valdés-Tresanco" },
]
keywords = ["environments", "conda", "micromamba", "ssh", "molsuite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
]

# The lowest layer of MolSuite: the standard library and nothing else.
dependencies = []

[project.optional-dependencies]
# Test + development tooling.
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/MolSuite/ms_env"
Documentation = "https://molsuite.github.io/ms_env/"
Issues = "https://github.com/MolSuite/ms_env/issues"

# The release tag is the only version there is: nothing to bump by hand, and
# a tag that does not match the metadata becomes impossible.
[tool.setuptools_scm]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
